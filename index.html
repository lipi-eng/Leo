<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-music"></i> Music Player</h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for songs, artists...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </header>

        <main class="main-content">
            <!-- Current Playing Section -->
            <div class="now-playing" id="nowPlaying" style="display: none;">
                <div class="track-info">
                    <img id="currentTrackImage" src="" alt="Track Image" class="track-image">
                    <div class="track-details">
                        <h3 id="currentTrackTitle">No track selected</h3>
                        <p id="currentTrackArtist">Unknown Artist</p>
                    </div>
                </div>
                
                <div class="player-controls">
                    <button id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button id="nextBtn"><i class="fas fa-step-forward"></i></button>
                </div>

                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <audio id="audioPlayer" preload="metadata"></audio>
            </div>

            <!-- Search Results -->
            <div class="search-results">
                <h2 id="resultsTitle">Popular Tracks</h2>
                <div id="tracksList" class="tracks-list">
                    <div class="loading" id="loading">
                        <i class="fas fa-spinner fa-spin"></i> Loading tracks...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
